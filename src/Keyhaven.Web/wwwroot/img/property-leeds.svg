<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Detached family house in Leeds with a garden">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3dedd"/><stop offset="1" stop-color="#f2e9db"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3d6bd"/><stop offset="1" stop-color="#cbb998"/></linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#76906a"/><stop offset="1" stop-color="#52694d"/></linearGradient>
    <filter id="grain"><feTurbulence baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="665" cy="100" r="48" fill="#f7ebd4"/>
  <!-- house -->
  <rect x="190" y="270" width="420" height="210" fill="url(#wall)"/>
  <path d="M160 280l240-150 240 150z" fill="#7a5c49"/>
  <path d="M200 268l200-124 200 124z" fill="#8f6f58"/>
  <rect x="360" y="150" width="50" height="80" fill="#8a6a52"/>
  <rect x="356" y="144" width="58" height="18" fill="#6e5240"/>
  <rect x="300" y="330" width="200" height="150" fill="#d9cbb2"/>
  <rect x="308" y="338" width="184" height="134" fill="#efe6d3" opacity=".55"/>
  <g fill="#31423b">
    <rect x="230" y="320" width="52" height="66" rx="3"/><rect x="518" y="320" width="52" height="66" rx="3"/>
    <rect x="230" y="415" width="52" height="65" rx="3"/><rect x="518" y="415" width="52" height="65" rx="3"/>
    <rect x="368" y="365" width="64" height="115" rx="3"/>
  </g>
  <g fill="#f1d9a7" opacity=".9"><rect x="238" y="330" width="16" height="24"/><rect x="526" y="425" width="16" height="24"/></g>
  <rect x="373" y="372" width="54" height="108" fill="#3b4d43"/>
  <circle cx="418" cy="430" r="3" fill="#d9b46d"/>
  <!-- driveway & garage -->
  <rect x="610" y="360" width="150" height="120" fill="#b8a888"/>
  <path d="M600 360l80-50 80 50z" fill="#7a5c49"/>
  <rect x="630" y="400" width="110" height="80" fill="#4a5a4f"/>
  <path d="M620 480h130l40 60H590z" fill="#a9a394"/>
  <!-- garden -->
  <path d="M0 520c120-30 260-20 400 0s280 30 400-10v90H0z" fill="url(#lawn)"/>
  <g fill="#47603f">
    <circle cx="80" cy="470" r="46"/><circle cx="140" cy="500" r="32"/><circle cx="720" cy="480" r="52"/><circle cx="770" cy="510" r="30"/>
    <rect x="76" y="500" width="10" height="50"/><rect x="716" y="505" width="12" height="45"/>
  </g>
  <g fill="#d8cdb5"><path d="M250 530h160l20 40H230z"/></g>
  <rect width="800" height="600" filter="url(#grain)" opacity=".5"/>
</svg>
