      <rect x="70" y="330" width="58" height="86" rx="4"/><rect x="170" y="330" width="58" height="86" rx="4"/><rect x="270" y="330" width="58" height="86" rx="4"/>
      <rect x="70" y="450" width="58" height="60" rx="4"/><rect x="270" y="450" width="58" height="60" rx="4"/>
