name: Release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Linux package
        run: >
          dotnet publish src/Keyhaven.Web/Keyhaven.Web.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained false
          --output publish

      - name: Create zip
        run: |
          cd publish
          rm -f *.pdb
          zip -r ../keyhaven-linux-x64.zip .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" keyhaven-linux-x64.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
